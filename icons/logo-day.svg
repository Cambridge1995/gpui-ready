<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rainbow" x1="53" y1="53" x2="203" y2="203" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#E05B47"/>
      <stop offset="0.17" stop-color="#E58A35"/>
      <stop offset="0.33" stop-color="#DDB52E"/>
      <stop offset="0.5"  stop-color="#35B273"/>
      <stop offset="0.67" stop-color="#3E85E0"/>
      <stop offset="0.83" stop-color="#5A64D8"/>
      <stop offset="1"    stop-color="#935FD0"/>
    </linearGradient>
  </defs>

  <!-- stacked asset layers -->
  <g transform="rotate(-6 108 108)">
    <rect x="33" y="33" width="150" height="150" rx="30" fill="#E58A35" opacity="0.20"/>
  </g>
  <g transform="rotate(-3 118 118)">
    <rect x="43" y="43" width="150" height="150" rx="30" fill="#5A64D8" opacity="0.26"/>
  </g>

  <!-- film frame -->
  <rect x="53" y="53" width="150" height="150" rx="30" fill="url(#rainbow)"/>

  <!-- sprocket holes -->
  <g fill="#FFFFFF">
    <rect x="65"  y="78"  width="12" height="18" rx="4"/>
    <rect x="65"  y="119" width="12" height="18" rx="4"/>
    <rect x="65"  y="160" width="12" height="18" rx="4"/>
    <rect x="179" y="78"  width="12" height="18" rx="4"/>
    <rect x="179" y="119" width="12" height="18" rx="4"/>
    <rect x="179" y="160" width="12" height="18" rx="4"/>
  </g>

  <!-- play triangle -->
  <path d="M108 96 L108 160 L164 128 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"
        stroke-linejoin="round"/>

  <!-- recording dot -->
  <circle cx="200" cy="48" r="8" fill="#F59E0B"/>
</svg>
